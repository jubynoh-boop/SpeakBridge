name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python -m compileall -q backend desktop

  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r desktop\requirements.txt
      - run: powershell -ExecutionPolicy Bypass -File .\desktop\build-hotkey.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SpeakBridgeHotkey-windows-x64
          path: desktop/dist/SpeakBridgeHotkey.exe
          if-no-files-found: error
